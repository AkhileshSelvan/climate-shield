# Local PostgreSQL matching the deployment target, so development, test and
# production all run the same database engine.
services:
  db:
    image: postgres:16
    container_name: climateshield-db
    environment:
      POSTGRES_USER: climateshield
      POSTGRES_PASSWORD: climateshield
      POSTGRES_DB: climateshield
    ports:
      - "5432:5432"
    volumes:
      - climateshield_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climateshield"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  climateshield_pgdata:
